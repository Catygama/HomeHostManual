name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_LOCATION: westeurope
  DEPLOYMENT_NAME: homehost-deploy

jobs:
  deploy-infra:
    name: Deploy Infrastructure (Bicep)
    runs-on: ubuntu-latest
    outputs:
      appServiceName: ${{ steps.outputs.outputs.appServiceName }}
      resourceGroupName: ${{ steps.outputs.outputs.resourceGroupName }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        run: |
          az deployment sub create \
            --location "$AZURE_LOCATION" \
            --name "$DEPLOYMENT_NAME" \
            --template-file infra/main.bicep

      - name: Read deployment outputs
        id: outputs
        run: |
          appServiceName=$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.appServiceName.value -o tsv)
          resourceGroupName=$(az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs.resourceGroupName.value -o tsv)
          echo "appServiceName=$appServiceName" >> "$GITHUB_OUTPUT"
          echo "resourceGroupName=$resourceGroupName" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy Frontend (App Service)
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Zip build output
        working-directory: frontend/dist
        run: zip -r ../dist.zip . -x '*.DS_Store'

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        run: |
          az webapp deploy \
            --resource-group "${{ needs.deploy-infra.outputs.resourceGroupName }}" \
            --name "${{ needs.deploy-infra.outputs.appServiceName }}" \
            --src-path frontend/dist.zip \
            --type zip \
            --async true
